name: Build Smart Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            python3-pip python3-venv python3-dev \
            autoconf automake libtool pkg-config gettext autopoint intltool \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev liblzma-dev \
            libgdbm-dev libdb-dev tk-dev tcl-dev \
            libzbar0 libzbar-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and toolchain prerequisites
        run: |
          python -m pip install --upgrade "pip==23.1.2" setuptools wheel virtualenv
          python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-debug-apk
          path: bin/*.apk
          if-no-files-found: error
